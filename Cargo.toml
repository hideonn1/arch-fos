[workspace]
resolver = "3"
members = [
    "crates/common",
    "crates/analyzer",
    "crates/collector",
    "crates/api",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/hideon/arch-fos"

[workspace.dependencies]
alpm = "5.0.2"
aya = "0.14"
axum = "0.8.9"
clap = { version = "4.5", features = ["derive", "env"] }
flate2 = "1.1"
hex = "0.4"
libc = "0.2"
mime_guess = "2.0"
netlink-packet-core = "0.9"
netlink-packet-sock-diag = "0.5.0"
netlink-sys = "0.8"
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
rust-embed = "8.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2.0"
tokio = { version = "1.45", features = ["full"] }
tokio-stream = "0.1"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tree-sitter = "0.25"
tree-sitter-bash = "0.25.1"
utoipa = { version = "6.0.0", features = ["macros"] }
utoipa-axum = "0.3.0"
yaml_serde = "0.10"
zbus = "6.4"
